<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interaktywny układ okresowy</title>
<style>
:root{
  --bg:#f5f9ff; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#dbeafe;
  --blue:#2563eb; --blue2:#0ea5e9;
  --s:#bfe3ff; --p:#ffd1d1; --d:#ccefc9; --f:#e4cef9;
  --cell:72px; --gap:5px; --section-gap:14px; --page-pad:16px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:linear-gradient(135deg,#eff6ff,#f8fbff 45%,#eef8ff);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
}
body{padding:var(--page-pad)}
.app{
  width:100%;height:calc(100dvh - (2 * var(--page-pad)));max-width:1600px;margin:0 auto;
  display:flex;flex-direction:column;min-height:0;gap:12px;
}
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0;padding:14px 16px;
  background:linear-gradient(120deg,#0f4ccf,#178bd8);color:#fff;
  border-radius:20px;box-shadow:0 14px 34px #2563eb20;
}
.switches{
  display:inline-flex;padding:4px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
}
.switches button{
  border:0;background:transparent;color:rgba(255,255,255,.88);padding:9px 15px;border-radius:10px;
  font-size:14px;font-weight:800;cursor:pointer;transition:.18s ease;white-space:nowrap;
}
.switches button:hover{color:#fff;background:rgba(255,255,255,.12)}
.switches button.active{background:#fff;color:#1746a2;box-shadow:0 2px 8px rgba(15,76,207,.18)}
.legend{
  min-height:34px;display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.92);
  font-size:12px;flex-wrap:wrap;justify-content:flex-end;
}
.legend .chip{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 8px;
}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.09)}
.gradient{
  width:180px;height:11px;border-radius:999px;
  background:linear-gradient(90deg,#2d6cdf 0%,#fff 50%,#dc3f45 100%);
  border:1px solid rgba(255,255,255,.55);
}
.radius-key{position:relative;width:140px;height:26px}
.radius-key .c{
  position:absolute;bottom:2px;border:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.2);border-radius:50%;transform:translateX(-50%);
}
.radius-key .c1{width:9px;height:9px;left:12%}
.radius-key .c2{width:18px;height:18px;left:50%}
.radius-key .c3{width:25px;height:25px;left:88%}
.note{font-size:11px;color:rgba(255,255,255,.78)}

.table-stage{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);border:1px solid #e6efff;border-radius:20px;
  padding:12px;box-shadow:0 10px 30px #1e40af0d;overflow:hidden;
}
.table-wrap{
  width:100%;height:100%;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.periodic{
  display:grid;grid-template-columns:repeat(18,var(--cell));grid-template-rows:repeat(7,var(--cell));
  gap:var(--gap);width:max-content;flex:0 0 auto;
}
.fblock{
  display:grid;grid-template-columns:repeat(17,var(--cell));grid-template-rows:repeat(2,var(--cell));
  gap:var(--gap);width:max-content;margin:var(--section-gap) auto 0;flex:0 0 auto;
}

.element,.placeholder{
  position:relative;border:1px solid rgba(18,34,56,.14);border-radius:calc(var(--cell) * .14);
  overflow:hidden;transition:transform .12s ease,box-shadow .12s ease,background .18s ease,color .18s ease,border-color .15s ease;
}
.element{
  cursor:default;display:flex;align-items:center;justify-content:center;min-width:0;
  box-shadow:0 2px 6px rgba(20,35,60,.06);outline:none;
}
.element:hover,.element:focus-visible{
  transform:translateY(-2px) scale(1.055);z-index:30;
  box-shadow:0 9px 24px rgba(30,64,175,.18);border-color:rgba(37,99,235,.35);
}
.element:focus-visible{box-shadow:0 0 0 3px rgba(37,99,235,.18),0 9px 24px rgba(30,64,175,.16)}
.placeholder{
  display:flex;align-items:center;justify-content:center;background:var(--f);color:#5b4a6b;
  font-weight:800;font-size:calc(var(--cell) * .16);border-style:dashed;
}
.z{
  position:absolute;left:calc(var(--cell) * .095);top:calc(var(--cell) * .075);
  font-size:calc(var(--cell) * .135);font-weight:800;opacity:.72;line-height:1;
}
.symbol{font-size:calc(var(--cell) * .35);font-weight:800;line-height:1;letter-spacing:-.02em;position:relative;z-index:2}
.value{
  position:absolute;left:3px;right:3px;bottom:calc(var(--cell) * .07);text-align:center;
  font-size:calc(var(--cell) * .115);font-weight:700;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.radius-circle{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(50,125,200,.15);border:1px solid rgba(50,125,200,.38);pointer-events:none;z-index:1;
}
.no-data::after{
  content:"—";position:absolute;right:calc(var(--cell) * .08);top:calc(var(--cell) * .06);
  font-weight:800;opacity:.45;font-size:calc(var(--cell) * .14);
}

/* Karta pierwiastka */
.tooltip{
  --card-accent:#9eb8d6;--card-accent-soft:#eef4fb;
  position:fixed;z-index:1000;pointer-events:none;width:min(310px,calc(100vw - 24px));
  background:rgba(255,255,255,.99);color:#172033;border:1px solid #dbeafe;
  border-radius:18px;box-shadow:0 18px 48px rgba(30,64,175,.20);
  opacity:0;transform:translateY(5px) scale(.985);transition:opacity .11s ease,transform .11s ease;
  overflow:hidden;visibility:hidden;
}
.tooltip.show{opacity:1;transform:none;visibility:visible}
.card-head{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(135deg,var(--card-accent-soft),#fff 75%);border-bottom:1px solid #e6efff;
}
.card-symbol{
  width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  background:var(--card-accent);font-size:30px;font-weight:900;letter-spacing:-.04em;
  box-shadow:inset 0 0 0 1px rgba(23,32,51,.08);
}
.card-heading{min-width:0;flex:1}
.card-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#788399;margin-bottom:2px}
.card-title{font-size:19px;font-weight:850;line-height:1.12}
.card-z{font-size:12px;color:#697386;margin-top:3px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px}
.metric{background:#f7faff;border:1px solid #e5efff;border-radius:11px;padding:9px 10px;min-width:0}
.metric-label{display:block;font-size:10px;font-weight:800;color:#7a8598;text-transform:uppercase;letter-spacing:.045em;margin-bottom:3px}
.metric-value{display:block;font-size:13px;font-weight:800;color:#1f2b3d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 11px;color:#748095;font-size:11px}
.block-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;border-radius:999px;background:var(--card-accent-soft);color:#435066;font-weight:800}
.block-dot{width:8px;height:8px;border-radius:50%;background:var(--card-accent)}

@media (max-width:760px){
  :root{--page-pad:8px;--section-gap:10px}
  html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
  body{padding:var(--page-pad)}
  .app{height:auto;min-height:100dvh;max-width:none;display:block}
  .toolbar{
    gap:8px;margin:0 0 10px;padding:12px;border-radius:18px;
  }
  .switches{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  .switches button{padding:9px 5px;font-size:11px;min-width:0}
  .legend{width:100%;justify-content:flex-start;font-size:10px;gap:6px;min-height:24px}
  .legend .chip{padding:4px 7px}
  .gradient{width:116px}
  .radius-key{width:110px}

  .table-stage{
    display:block;width:100%;min-height:0;padding:10px;
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scrollbar-width:thin;
    scrollbar-color:#93c5fd #eff6ff;
  }
  .table-stage::-webkit-scrollbar{height:9px}
  .table-stage::-webkit-scrollbar-track{background:#eff6ff;border-radius:999px}
  .table-stage::-webkit-scrollbar-thumb{background:#93c5fd;border-radius:999px;border:2px solid #eff6ff}

  .table-wrap{
    width:max-content;height:auto;min-width:max-content;min-height:0;overflow:visible;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    padding:2px 2px 8px;
  }
  .periodic,.fblock{flex:none}
  .element:hover{transform:none}
  .tooltip{width:min(290px,calc(100vw - 20px))}
}

@media (max-width:430px){
  .toolbar{padding:10px}
  .switches button{font-size:10px}
  .legend{font-size:9.5px}
}
</style>
</head>
<body>
<div class="app">

    <div class="table-wrap" id="tableWrap">
      <div class="periodic" id="periodic"></div>
      <div class="fblock" id="fblock"></div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

let mode="default";
const root=document.documentElement;
const periodic=document.getElementById("periodic");
const fblock=document.getElementById("fblock");
const legend=document.getElementById("legend");
const tooltip=document.getElementById("tooltip");
const tableWrap=document.getElementById("tableWrap");

const BLOCK_COLORS={s:"var(--s)",p:"var(--p)",d:"var(--d)",f:"var(--f)"};
const CARD_COLORS={
  s:{accent:"#bfe3ff",soft:"#edf8ff"},
  p:{accent:"#ffd1d1",soft:"#fff1f1"},
  d:{accent:"#ccefc9",soft:"#effbed"},
  f:{accent:"#e4cef9",soft:"#f7efff"}
};

function mix(a,b,t){
  return a.map((v,i)=>Math.round(v+(b[i]-v)*t));
}
function enColor(v){
  const min=.70, mid=2.34, max=3.98;
  const blue=[45,108,223], white=[255,255,255], red=[220,63,69];
  let rgb;
  if(v<=mid) rgb=mix(blue,white,Math.max(0,Math.min(1,(v-min)/(mid-min))));
  else rgb=mix(white,red,Math.max(0,Math.min(1,(v-mid)/(max-mid))));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
function textColor(bg){
  const m=bg.match(/\d+/g); if(!m) return "#172033";
  const [r,g,b]=m.map(Number);
  const lum=(.2126*r+.7152*g+.0722*b)/255;
  return lum<.57 ? "#fff" : "#172033";
}
function cellHTML(e){
  let val="";
  if(mode==="default") val=e.m;
  if(mode==="en") val=e.en==null ? "brak danych" : `χ = ${e.en.toFixed(2)}`;
  if(mode==="radius") val=e.r==null ? "brak danych" : `${e.r} pm`;
  return `<span class="z">${e.z}</span><span class="symbol">${e.s}</span><span class="value">${val}</span>`;
}
function applyStyle(el,e){
  el.classList.toggle("no-data",(mode==="en"&&e.en==null)||(mode==="radius"&&e.r==null));
  el.style.color="#172033";
  el.style.background="#fff";
  el.querySelectorAll(".radius-circle").forEach(x=>x.remove());

  if(mode==="default"){
    el.style.background=BLOCK_COLORS[e.b];
  } else if(mode==="en"){
    if(e.en==null){
      el.style.background="#edf0f4"; el.style.color="#788399";
    } else {
      const bg=enColor(e.en); el.style.background=bg; el.style.color=textColor(bg);
    }
  } else {
    el.style.background="#fbfcfe";
    if(e.r!=null){
      const d=14 + (e.r-32)/(225-32)*46;
      const cell=parseFloat(getComputedStyle(root).getPropertyValue("--cell"))||72;
      const scaled=Math.max(5, d*(cell/72));
      const c=document.createElement("span");
      c.className="radius-circle"; c.style.width=scaled+"px"; c.style.height=scaled+"px";
      el.appendChild(c);
    } else el.style.color="#8791a2";
  }
}
function tooltipHTML(e){
  const en=e.en==null?"—":e.en.toFixed(2);
  const r=e.r==null?"—":e.r+" pm";
  const block=e.b.toUpperCase();
  return `
    <div class="card-head">
      <div class="card-symbol">${e.s}</div>
      <div class="card-heading">
        <div class="card-kicker">Pierwiastek</div>
        <div class="card-title">${e.s}</div>
        <div class="card-z">Liczba atomowa Z = ${e.z}</div>
      </div>
    </div>
    <div class="card-grid">
      <div class="metric">
        <span class="metric-label">Masa atomowa</span>
        <span class="metric-value">${e.m} u</span>
      </div>
      <div class="metric">
        <span class="metric-label">Elektroujemność</span>
        <span class="metric-value">${en}</span>
      </div>
      <div class="metric">
        <span class="metric-label">Promień atomowy</span>
        <span class="metric-value">${r}</span>
      </div>
      <div class="metric">
        <span class="metric-label">Blok</span>
        <span class="metric-value">${block}</span>
      </div>
    </div>
    <div class="card-foot">
      <span>Skala Paulinga · promień w pm</span>
      <span class="block-pill"><i class="block-dot"></i>blok ${e.b}</span>
    </div>`;
}
function positionTooltip(el){
  const card=tooltip.getBoundingClientRect();
  const r=el.getBoundingClientRect();
  const pad=10, offset=12;
  let x=r.right+offset;
  let y=r.top+(r.height-card.height)/2;

  if(x+card.width>window.innerWidth-pad) x=r.left-card.width-offset;
  if(x<pad) x=Math.min(window.innerWidth-card.width-pad,Math.max(pad,r.left+(r.width-card.width)/2));
  y=Math.max(pad,Math.min(y,window.innerHeight-card.height-pad));

  tooltip.style.left=Math.round(x)+"px";
  tooltip.style.top=Math.round(y)+"px";
}
function showTooltip(el,e){
  const colors=CARD_COLORS[e.b];
  tooltip.style.setProperty("--card-accent",colors.accent);
  tooltip.style.setProperty("--card-accent-soft",colors.soft);
  tooltip.innerHTML=tooltipHTML(e);
  tooltip.classList.add("show");
  requestAnimationFrame(()=>positionTooltip(el));
}
function hideTooltip(){
  tooltip.classList.remove("show");
}
function bindTooltip(el,e){
  el.addEventListener("mouseenter",()=>showTooltip(el,e));
  el.addEventListener("mouseleave",hideTooltip);
  el.addEventListener("focus",()=>showTooltip(el,e));
  el.addEventListener("blur",hideTooltip);
}
function makeElement(e,target){
  const el=document.createElement("div");
  el.className="element"; el.dataset.z=e.z; el.innerHTML=cellHTML(e);
  el.tabIndex=0;
  el.setAttribute("aria-label",`${e.s}, liczba atomowa ${e.z}`);
  if(target==="main"){el.style.gridRow=e.row;el.style.gridColumn=e.col;}
  else {el.style.gridRow=e.frow;el.style.gridColumn=e.fcol;}
  applyStyle(el,e); bindTooltip(el,e); return el;
}
function render(){
  hideTooltip();
  periodic.innerHTML=""; fblock.innerHTML="";
  DATA.filter(e=>e.row).forEach(e=>periodic.appendChild(makeElement(e,"main")));

  for(const p of [{row:6,col:3,label:"57–71"},{row:7,col:3,label:"89–103"}]){
    const x=document.createElement("div");x.className="placeholder";x.textContent=p.label;x.style.gridRow=p.row;x.style.gridColumn=p.col;periodic.appendChild(x);
  }
  DATA.filter(e=>e.frow).forEach(e=>fblock.appendChild(makeElement(e,"f")));

  if(mode==="default"){
    legend.innerHTML=`
      <span class="chip"><span class="swatch" style="background:var(--s)"></span>blok s</span>
      <span class="chip"><span class="swatch" style="background:var(--p)"></span>blok p</span>
      <span class="chip"><span class="swatch" style="background:var(--d)"></span>blok d</span>
      <span class="chip"><span class="swatch" style="background:var(--f)"></span>blok f</span>`;
  } else if(mode==="en"){
    legend.innerHTML=`<span>0,70</span><span class="gradient"></span><span>3,98</span><span class="note">— = brak wartości</span>`;
  } else {
    legend.innerHTML=`<span>mniejszy</span><span class="radius-key"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i></span><span>większy</span><span class="note">pm · — = brak wartości</span>`;
  }
  requestAnimationFrame(fitLayout);
}
function fitLayout(){
  const mobile=window.matchMedia("(max-width:760px)").matches;

  if(mobile){
    // Na telefonie zachowujemy czytelny rozmiar komórek i przewijamy tabelę w poziomie.
    const cell=Math.max(54,Math.min(62,window.innerWidth*.15));
    root.style.setProperty("--cell",cell+"px");
    root.style.setProperty("--gap","4px");
    root.style.setProperty("--section-gap","10px");
  } else {
    // Na komputerze cały układ ma zawsze zmieścić się w dostępnym widoku.
    const rect=tableWrap.getBoundingClientRect();
    if(rect.width<=0||rect.height<=0) return;

    const gap=Math.max(1.5,Math.min(5,rect.width/300));
    const sectionGap=Math.max(6,Math.min(14,rect.height*.025));

    // 18 kolumn w części głównej, 9 rzędów łącznie (7 + 2).
    const cellByWidth=(rect.width-(17*gap))/18;
    const cellByHeight=(rect.height-sectionGap-(7*gap))/9;
    const cell=Math.max(8,Math.min(76,cellByWidth,cellByHeight));

    root.style.setProperty("--cell",cell+"px");
    root.style.setProperty("--gap",gap+"px");
    root.style.setProperty("--section-gap",sectionGap+"px");
  }

  // Okręgi promieni są tworzone z uwzględnieniem aktualnego rozmiaru komórki.
  if(mode==="radius"){
    document.querySelectorAll(".element").forEach(el=>{
      const e=DATA.find(x=>x.z===Number(el.dataset.z));
      if(e) applyStyle(el,e);
    });
  }
}
document.querySelectorAll(".switches button").forEach(btn=>btn.addEventListener("click",()=>{
  mode=btn.dataset.mode;
  document.querySelectorAll(".switches button").forEach(b=>{b.classList.toggle("active",b===btn);b.setAttribute("aria-selected",b===btn?"true":"false")});
  render();
}));

window.addEventListener("resize",()=>{hideTooltip();fitLayout();});
if("ResizeObserver" in window){
  new ResizeObserver(()=>fitLayout()).observe(tableWrap);
}
render();
</script>
