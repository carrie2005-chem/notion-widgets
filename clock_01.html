<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Zegar do Notion</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbfbfc;
      --fg: #242832;
      --muted: #6d7482;
      --line: #e6e8ed;
      --button-bg: #f0f1f4;
      --button-hover: #e6e8ee;
      --focus: #4469d4;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1b1e26;
      --fg: #f5f5f7;
      --muted: #acb2c0;
      --line: #353943;
      --button-bg: #2d323d;
      --button-hover: #3a414e;
      --focus: #a2b7ff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      background: transparent;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .widget {
      width: 100%;
      min-height: 174px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 48px 14px 22px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease;
    }
    .theme-toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border: 0;
      border-radius: 9px;
      background: var(--button-bg);
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      line-height: 1.3;
      cursor: pointer;
      transition: background-color .18s ease, color .18s ease;
    }
    .theme-toggle:hover { background: var(--button-hover); color: var(--fg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .theme-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .clock {
      font-size: clamp(34px, 10vw, 68px);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      line-height: 1.1;
      letter-spacing: -.055em;
      white-space: nowrap;
      text-align: center;
    }
    .date {
      margin-top: 8px;
      font-size: clamp(11px, 2.8vw, 14px);
      line-height: 1.35;
      text-align: center;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="Zegar pokazujący aktualny czas urządzenia">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Włącz motyw ciemny">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.8 13.1A8.5 8.5 0 0 1 10.9 3.2 8.5 8.5 0 1 0 20.8 13.1Z"/>
      </svg>
      <span id="themeLabel">Ciemny</span>
    </button>
    <div class="clock" id="clock" role="timer" aria-live="off">--:--:--</div>
    <div class="date" id="date">Ładowanie daty…</div>
  </main>
  <script>
    (() => {
      'use strict';
      const root = document.documentElement;
      const clock = document.getElementById('clock');
      const date = document.getElementById('date');
      const toggle = document.getElementById('themeToggle');
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      const storageKey = 'notion-clock-theme-v1';
      const timeFormatter = new Intl.DateTimeFormat('pl-PL', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      });
      const dateFormatter = new Intl.DateTimeFormat('pl-PL', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      function storedTheme() {
        try {
          const theme = localStorage.getItem(storageKey);
          return (theme === 'dark' || theme === 'light') ? theme : null;
        } catch (_) { return null; }
      }
      function saveTheme(theme) {
        try { localStorage.setItem(storageKey, theme); } catch (_) { /* Private browsing or iframe storage restrictions */ }
      }
      function setTheme(theme) {
        const dark = theme === 'dark';
        root.dataset.theme = theme;
        toggle.setAttribute('aria-label', dark ? 'Włącz motyw jasny' : 'Włącz motyw ciemny');
        toggle.setAttribute('aria-pressed', String(dark));
        label.textContent = dark ? 'Jasny' : 'Ciemny';
        icon.innerHTML = dark
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
          : '<path d="M20.8 13.1A8.5 8.5 0 0 1 10.9 3.2 8.5 8.5 0 1 0 20.8 13.1Z"/>';
      }
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(storedTheme() || (systemDark ? 'dark' : 'light'));
      toggle.addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        saveTheme(next);
      });
      function updateClock() {
        const now = new Date();
        clock.textContent = timeFormatter.format(now);
        date.textContent = dateFormatter.format(now);
      }
      updateClock();
      setInterval(updateClock, 250);
    })();
  </script>
</body>
</html>
